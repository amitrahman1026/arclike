<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0b;
      color: #fafafa;
      padding: 20px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e1e21;
    }
    
    .header img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
    }
    
    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    
    .status.connected {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    
    .status.disconnected {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .status.connected .status-dot {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }
    
    .status.disconnected .status-dot {
      background: #ef4444;
    }
    
    .status-text {
      font-size: 13px;
      line-height: 1.4;
    }
    
    .status.connected .status-text {
      color: #22c55e;
    }
    
    .status.disconnected .status-text {
      color: #ef4444;
    }
    
    .shortcut {
      background: #111113;
      border: 1px solid #1e1e21;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    
    .shortcut-label {
      font-size: 11px;
      color: #71717a;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .keys {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .key {
      background: linear-gradient(180deg, #1a1a1d 0%, #0f0f10 100%);
      border: 1px solid #2a2a2d;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: #e4e4e7;
      box-shadow: 0 1px 0 #2a2a2d, 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .key-plus {
      color: #71717a;
      font-size: 10px;
    }
    
    .help-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #71717a;
      text-decoration: none;
    }
    
    .help-link:hover {
      color: #fafafa;
    }

    .update-banner {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 12px;
      line-height: 1.4;
    }

    .update-banner.cws {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .update-banner.update {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.2);
      color: #facc15;
    }

    .update-banner a {
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
    }

    .setting-input {
      width: 64px;
      background: #1a1a1d;
      border: 1px solid #2a2a2d;
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 12px;
      color: #e4e4e7;
      text-align: center;
    }

    .setting-hint {
      margin-top: 8px;
      font-size: 10px;
      color: #52525b;
    }

    .setting-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #e4e4e7;
      cursor: pointer;
    }

    .version-label {
      text-align: center;
      margin-top: 12px;
      font-size: 10px;
      color: #52525b;
    }
    .import-text {
      font-size: 12px;
      line-height: 1.5;
      color: #e4e4e7;
      margin-bottom: 10px;
    }

    .import-text .muted {
      color: #71717a;
    }

    .import-text.error {
      color: #f87171;
    }

    .import-tree {
      font-size: 11px;
      line-height: 1.6;
      color: #a1a1aa;
      text-align: left;
      margin-bottom: 10px;
    }

    .import-tree-label {
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 10px;
      margin-top: 6px;
    }

    .import-tree-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-left: 10px;
    }

    .import-tree-row span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .import-tree-row span:last-child {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .import-tree a {
      color: #60a5fa;
      text-decoration: none;
    }

    .import-tree a:hover {
      text-decoration: underline;
    }

    .import-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .btn {
      background: #1a1a1d;
      border: 1px solid #2a2a2d;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      color: #e4e4e7;
      cursor: pointer;
    }

    .btn:hover {
      background: #232327;
    }

    .btn.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .btn.primary:hover {
      background: #1d4ed8;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="Arclike">
    <h1>Arclike</h1>
  </div>
  
  <div class="status" id="status">
    <div class="status-dot"></div>
    <div class="status-text" id="status-text">Checking...</div>
  </div>
  
  <div class="update-banner" id="update-banner"></div>

  <div class="shortcut">
    <div class="shortcut-label">Switch Tabs</div>
    <div class="keys" id="tab-switch-keys">
      <span class="key">⌃ Ctrl</span>
      <span class="key-plus">+</span>
      <span class="key">Tab</span>
    </div>
  </div>

  <div class="shortcut" style="margin-top: 8px">
    <div class="shortcut-label">Cancel Switch</div>
    <div class="keys">
      <span class="key">⌃ Ctrl</span>
      <span class="key-plus">+</span>
      <span class="key">Esc</span>
    </div>
  </div>

  <div class="shortcut" style="margin-top: 8px">
    <div class="shortcut-label">Copy Current URL</div>
    <div class="keys" id="copy-url-keys">
      <span class="key">⌘ Cmd</span>
      <span class="key-plus">+</span>
      <span class="key">⇧ Shift</span>
      <span class="key-plus">+</span>
      <span class="key">C</span>
    </div>
  </div>

  <div class="shortcut" style="margin-top: 8px">
    <div class="shortcut-label">Command Bar (new tab / this tab)</div>
    <div class="keys" id="command-bar-keys">
      <span class="key">⌘ T</span>
      <span class="key-plus">/</span>
      <span class="key">⌘ L</span>
    </div>
  </div>

  <div class="shortcut" style="margin-top: 8px">
    <div class="shortcut-label">Max Tabs in Switcher</div>
    <input type="number" class="setting-input" id="max-tabs" min="0" max="50" step="1">
    <div class="setting-hint">0 = no limit</div>
  </div>

  <div class="shortcut" style="margin-top: 8px">
    <div class="shortcut-label">Little Arc</div>
    <label class="setting-toggle">
      <input type="checkbox" id="little-arc-links">
      Open links from other apps in Little Arc
    </label>
    <div class="setting-hint">Arclike guesses from timing, so now and then a tab you opened may move too.</div>
  </div>

  <div class="shortcut" style="margin-top: 8px" id="arc-import">
    <div class="shortcut-label">Arc</div>
    <div class="import-text" id="arc-import-text" hidden></div>
    <div class="import-tree" id="arc-import-tree" hidden></div>
    <div class="import-buttons" id="arc-import-buttons">
      <button class="btn" id="arc-import-start">Import from Arc</button>
    </div>
  </div>

  <a href="https://github.com/amitrahman1026/arclike#installation" target="_blank" class="help-link">Setup help →</a>

  <div class="version-label" id="version-label"></div>

  <script src="popup.js"></script>
</body>
</html>
